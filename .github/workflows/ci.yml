name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/audit-branch-flow.sh tests/audit-branch-flow-tests.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Bash version
        run: bash --version

      - name: Check shell syntax
        run: bash -n scripts/audit-branch-flow.sh tests/audit-branch-flow-tests.sh

      - name: Run tests
        run: bash tests/audit-branch-flow-tests.sh
